name: Atualizar cupons

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6h (UTC), fora da hora cheia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Criar .env a partir dos secrets
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          X_TOKEN: ${{ secrets.X_TOKEN }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
          LAT: ${{ secrets.LAT }}
          LNG: ${{ secrets.LNG }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          for k in REFRESH_TOKEN X_TOKEN DEVICE_ID LAT LNG BASE_URL; do
            printf '%s=%s\n' "$k" "${!k}" >> .env
          done
          printf 'DATA_DIR=data\n' >> .env

      - name: Baixar cupons e comparar
        run: python scrape.py

      # The API hands out a new refresh token on every use; store it so the
      # secret never ages out. Runs even if the scrape failed after refreshing.
      - name: Salvar refresh token novo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OLD_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          [ -f .env ] || exit 0
          NEW_TOKEN=$(grep '^REFRESH_TOKEN=' .env | cut -d= -f2-)
          echo "::add-mask::$NEW_TOKEN"
          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "$OLD_TOKEN" ]; then
            echo "Token não mudou."
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret GH_PAT ausente — refresh token novo não foi salvo."
          else
            printf '%s' "$NEW_TOKEN" | gh secret set REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "Refresh token atualizado."
          fi
          rm -f .env

      # Volatile fields (aberto, today…) change on every run; only commit when
      # the changelog or the filter config actually changed.
      - name: Commit se houve mudança
        id: commit
        run: |
          if git diff --quiet -- data/changes data/config.json && \
             [ -z "$(git ls-files --others --exclude-standard data/changes)" ]; then
            echo "Nenhuma mudança real — nada a publicar."
            git checkout -- data
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): atualização automática $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
