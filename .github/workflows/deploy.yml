name: Deploy

# Runs on code pushes to main, and is called by update-data.yml after a data
# commit (pushes made with GITHUB_TOKEN don't trigger other workflows).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # main, not github.sha: when called right after a data commit, the
      # caller's sha is the commit before it.
      - uses: actions/checkout@v4
        with:
          ref: main

      # Without an id, wrangler would create a new database on every run.
      - name: Conferir database_id
        run: |
          if ! grep -q '"database_id"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc não tem database_id. Faça o primeiro deploy à mão (ver README) e commite o id."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build e deploy
        env:
          VITE_CARTO_KEY: ${{ secrets.VITE_CARTO_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
